services:
  app:
    build:
      context: ./app
    container_name: app
    network_mode: host
    volumes:
      - ./app:/usr/src/app

      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: Europe/Moscow

      "TRANSFORMER_NAME": "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      "BASE_PATH": "./"
    restart: unless-stopped
